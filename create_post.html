<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布帖子 - Code小巷</title>
    <link rel="stylesheet" href="css/createpost.css">
</head>
<body>
    <header>
        <h1>发布帖子</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="home.html">主页</a></li>
                <li><a href="create_post.html">发布帖子</a></li>
                <li><a href="my_post.html">我的帖子</a></li>
                <li><a href="logout.html">退出</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="create-post-section">
            <form id="createPostForm">
                <div class="form-group">
                    <label for="postTitle">标题</label>
                    <input type="text" id="postTitle" name="postTitle" placeholder="请输入帖子标题" required>
                </div>
                <div class="form-group">
                    <label for="postContent">内容</label>
                    <textarea id="postContent" name="postContent" placeholder="请输入帖子内容" rows="8" required></textarea>
                </div>

                <div class="form-group">
                    <label for="postTags">标签</label>
                    <input type="text" id="postTags" name="postTags" placeholder="添加标签（逗号分隔）">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitPost">发布</button>
                    <button type="reset">重置</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Code小巷. All rights reserved.</p>
    </footer>

    <script src="templates/create_post.js"></script>
</body>
</html>
